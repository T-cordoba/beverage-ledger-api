# Local Postgres for development.
#
#   db     -> working database, an offline alternative to Supabase
#   shadow -> shadow database `prisma migrate dev` creates and drops to detect
#             drift, which Supabase's application role is not allowed to do

services:
  db:
    image: postgres:17-alpine
    container_name: beverage-ledger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beverage_ledger
    ports:
      # 5434, not 5432, to avoid clashing with a locally installed Postgres.
      - '5434:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  shadow:
    image: postgres:17-alpine
    container_name: beverage-ledger-shadow
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beverage_ledger_shadow
    ports:
      - '5433:5432'
    # No volume: ephemeral by definition.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
