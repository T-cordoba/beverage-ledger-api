# Render blueprint. Secrets are marked `sync: false`: Render asks for them once
# in the dashboard and never stores them in the repository.
services:
  - type: web
    name: beverage-ledger-api
    # Render builds the repository's Dockerfile, the same one the Jenkins
    # pipeline builds and health-checks before asking for this deploy.
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Same region as the Supabase project (us-east-2) to keep the round trip short.
    region: ohio

    # Jenkins requests each deploy for the commit that passed its quality gate
    # and runs `prisma migrate deploy` right before it, since a Docker service
    # has no build command to hang it on and the pre-deploy hook is paid. A
    # push-triggered deploy would skip both.
    autoDeploy: false

    # Answers 503 when Postgres is unreachable, so a bad deploy never goes live.
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: SWAGGER_ENABLED
        value: 'true'

      # PORT is injected by Render; setting it here would override the binding.

      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false

      # Both are the Vercel origin, and CORS_ORIGINS has no trailing slash.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      - key: DEFAULT_ORGANIZATION_SLUG
        value: demo
