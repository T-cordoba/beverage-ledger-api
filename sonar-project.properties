sonar.projectKey=T-cordoba_beverage-ledger-api
sonar.organization=t-cordoba

sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Prisma client, generated by `prisma generate` and gitignored, plus build output.
sonar.exclusions=src/generated/**,dist/**,prisma/migrations/**

# Coverage is reported only for the modules the suite in test/ actually executes.
# Sonar patterns cannot be negated, so the complement is spelled out; anything not
# listed here is one of the 9 files in vitest.config.mts `coverage.include`.
# A file left in would be counted as 0% and would misreport what is under test.
sonar.coverage.exclusions=\
  src/main.ts,\
  src/app.module.ts,\
  src/generated/**,\
  src/config/**,\
  src/infra/**,\
  src/common/**,\
  src/**/*.module.ts,\
  src/**/*.controller.ts,\
  src/**/dto/**,\
  src/modules/audit/audit.actions.ts,\
  src/modules/audit/audit.metadata.ts,\
  src/modules/audit/audit.service.ts,\
  src/modules/auth/auth.throttle.ts,\
  src/modules/auth/auth-cookie.service.ts,\
  src/modules/auth/jwt-payload.ts,\
  src/modules/auth/password.service.ts,\
  src/modules/auth/token.service.ts,\
  src/modules/auth/guards/**,\
  src/modules/auth/strategies/**,\
  src/modules/auth/repositories/**,\
  src/modules/catalog/brands.service.ts,\
  src/modules/catalog/categories.service.ts,\
  src/modules/catalog/repositories/**,\
  src/modules/documents/**,\
  src/modules/health/**,\
  src/modules/inventory/locations.service.ts,\
  src/modules/inventory/repositories/locations.repository.ts,\
  src/modules/inventory/repositories/movements.repository.ts,\
  src/modules/invitations/repositories/**,\
  src/modules/organizations/**,\
  src/modules/reports/repositories/**,\
  src/modules/users/repositories/users.repository.ts
